resources:
  jobs:
    procurement_pipeline:
      name: procurement-pipeline
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: max_tenders
          default: "${var.max_tenders}"

      email_notifications:
        on_failure:
          - ${var.alert_email}

      schedule:
        quartz_cron_expression: "0 0 21 * * ?"
        timezone_id: Europe/Madrid

      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/01_bronze_incremental.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          max_retries: 1
          timeout_seconds: 3600

        - task_key: silver_tenders
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/02_silver_tenders.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800

        - task_key: gold_tenders
          depends_on:
            - task_key: silver_tenders
          notebook_task:
            notebook_path: ../notebooks/03_gold_tenders.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800

        - task_key: download_documents
          depends_on:
            - task_key: gold_tenders
          notebook_task:
            notebook_path: ../notebooks/04_download_documents.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              max_tenders: "{{job.parameters.max_tenders}}"
          max_retries: 1
          timeout_seconds: 3600

        - task_key: extract_pages
          depends_on:
            - task_key: download_documents
          notebook_task:
            notebook_path: ../notebooks/05_extract_pages.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 3600

        - task_key: chunk_documents
          depends_on:
            - task_key: extract_pages
          notebook_task:
            notebook_path: ../notebooks/06_chunk_documents.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800

        - task_key: sync_vector_index
          depends_on:
            - task_key: chunk_documents
          notebook_task:
            notebook_path: ../notebooks/07_vector_index.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 5400

        - task_key: export_tender_catalog
          depends_on:
            - task_key: sync_vector_index
          notebook_task:
            notebook_path: ../notebooks/10_export_tender_catalog.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          timeout_seconds: 1800
