[project]
name = "public-procurement-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.21.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
    "notas",
    "notebooks",
]
