bundle:
  name: public-procurement-intelligence

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the bronze, silver and gold schemas
    default: procurement
  alert_email:
    description: Address notified when the pipeline job fails

sync:
  exclude:
    - docs/**
    - tests/**

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: procurement_dev

  prod:
    variables:
      catalog: procurement
    resources:
      apps:
        procurement_qa:
          name: procurement-qa
          description: Question answering over Spanish public tender documents
          source_code_path: .
          resources:
            - name: generator
              serving_endpoint:
                name: databricks-gpt-oss-120b
                permission: CAN_QUERY
